name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  deployments: write

jobs:
  check:
    uses: ./.github/workflows/core-check.yml
    permissions:
      contents: read

  deploy:
    needs: check
    uses: JianyueLab-Org/actions/.github/workflows/deploy-k8s.yml@6e93a527ed6c167db28ed89ecb29cfcc849007ef # main
    with:
      image: ghcr.io/jianyuelab-org/pw-homepage
      namespace: pw-homepage
      manifest: deploy/k8s.yaml
      environment_url: https://postal.wiki
    secrets:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
